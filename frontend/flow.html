<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Part Factory Flow — Manufacturing</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="brand-home" href="/">
        <span class="brand-dot"></span>
        <h1>Part Factory Flow</h1>
      </a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/logs">Log Viewer</a>
      </nav>
    </div>
    <div class="user-box hidden" id="user-box">
      <span id="user-name"></span>
      <button id="logout" class="btn-ghost" type="button">Sign out</button>
    </div>
  </header>

  <section class="filters">
    <select id="part-select">
      <option value="">Select a part…</option>
    </select>
    <select id="job-select" disabled>
      <option value="">All jobs (part map)</option>
    </select>
  </section>

  <main class="flow-main">
    <div id="empty-flow" class="empty-flow">
      <p>No part selected.</p>
      <p>Please select a part at the top left to see its factory flow.</p>
    </div>
    <div id="funnel" class="funnel hidden"></div>
    <div id="diagram-wrap" class="diagram-wrap hidden">
      <svg id="diagram" width="100%" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="timeline" class="timeline hidden"></div>
  </main>

  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <h2 id="drawer-title"></h2>
      <button id="drawer-close" class="btn-ghost" type="button">&times;</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

  <script type="module" src="/assets/flow.js"></script>
</body>
</html>
