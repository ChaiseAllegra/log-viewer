<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Viewer — Manufacturing</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="brand-home" href="/">
        <span class="brand-dot"></span>
        <h1>Log Viewer</h1>
      </a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/flow">Part Flow</a>
      </nav>
    </div>
    <div class="stats" id="stats"></div>
    <div class="user-box hidden" id="user-box">
      <span id="user-name"></span>
      <button id="logout" class="btn-ghost" type="button">Sign out</button>
    </div>
  </header>

  <section class="filters">
    <select id="event-type">
      <option value="">All event types</option>
    </select>
    <input id="job" type="text" list="job-options" placeholder="All jobs" autocomplete="off" />
    <datalist id="job-options"></datalist>
    <select id="part">
      <option value="">All parts</option>
    </select>
    <select id="machine">
      <option value="">All machines</option>
    </select>
    <select id="customer">
      <option value="">All customers</option>
    </select>
    <select id="material">
      <option value="">All materials</option>
    </select>
    <select id="facility">
      <option value="">All facilities</option>
    </select>
    <div class="range-group" title="From (time optional, defaults to 00:00)">
      <span class="range-label">From</span>
      <input id="start-date" type="date" />
      <input id="start-time" type="time" />
    </div>
    <div class="range-group" title="To (time optional, defaults to 23:59)">
      <span class="range-label">To</span>
      <input id="end-date" type="date" />
      <input id="end-time" type="time" />
    </div>
    <button id="clear" class="btn-ghost" type="button">Clear</button>
  </section>

  <main>
    <div class="table-wrap">
      <table id="log-table">
        <thead>
          <tr>
            <th id="ts-header" class="sortable">Timestamp</th>
            <th>Event type</th>
            <th>Event ID</th>
            <th>Job</th>
            <th>Part</th>
            <th>Machine</th>
            <th>Customer</th>
            <th>Material</th>
            <th>Facility</th>
            <th class="num">Qty</th>
            <th>Metadata</th>
            <th>Raw log</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
      <div id="empty" class="empty hidden">No events match the current filters.</div>
    </div>

    <footer class="pager">
      <span id="page-info"></span>
      <div class="pager-controls">
        <button id="prev" class="btn" type="button">&larr; Prev</button>
        <button id="next" class="btn" type="button">Next &rarr;</button>
        <select id="page-size">
          <option value="25">25 / page</option>
          <option value="50" selected>50 / page</option>
          <option value="100">100 / page</option>
          <option value="200">200 / page</option>
        </select>
      </div>
    </footer>
  </main>

  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <h2 id="drawer-title"></h2>
      <button id="drawer-close" class="btn-ghost" type="button">&times;</button>
    </div>
    <pre id="drawer-json"></pre>
  </aside>
  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

  <script type="module" src="/assets/main.js"></script>
</body>
</html>
